name: Build and release

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  PUB_HOSTED_URL: https://pub.dev

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  native-tools:
    uses: ./.github/workflows/native-media.yml
    with:
      android: true
      windows: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}

  validate:
    needs: native-tools
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check method trace coverage
        run: dart --disable-dart-dev --packages=.dart_tool/package_config.json tool/check_method_trace.dart
      - name: Restore source-built native media executables
        uses: actions/download-artifact@v7
        with:
          pattern: android-tools-*
          path: android/app/src/main/jniLibs/
          merge-multiple: true
      - name: Compile Android (debug validation only, never published)
        run: flutter build apk --debug --target-platform android-arm64 --no-pub

  signed:
    needs: native-tools
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    env:
      SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_UPLOAD_SYMBOLS: 'true'
      SENTRY_ENVIRONMENT: production
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Require release telemetry configuration
        run: |
          set -euo pipefail
          for name in SENTRY_DSN SENTRY_ORG SENTRY_PROJECT SENTRY_AUTH_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required Sentry configuration $name is missing; configure variables SENTRY_DSN/SENTRY_ORG/SENTRY_PROJECT and secret SENTRY_AUTH_TOKEN."
              exit 1
            fi
          done
      - name: Check version and tag
        id: version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          match = re.search(r'^version:\s*(\d+\.\d+\.\d+)\+(\d+)\s*$', Path('pubspec.yaml').read_text(), re.M)
          if not match:
              raise SystemExit('pubspec.yaml must contain a stable version: X.Y.Z+N')
          version = match[1]
          ref = os.environ['RELEASE_REF']
          if ref.startswith('refs/tags/') and ref != f'refs/tags/v{version}':
              raise SystemExit(f'Tag must equal v{version} from pubspec.yaml')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
              output.write(f'release=xmplus@{version}+{match[2]}\n')
              output.write(f'dist={match[2]}\n')
          PY
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Restore source-built native media executables
        uses: actions/download-artifact@v7
        with:
          pattern: android-tools-*
          path: android/app/src/main/jniLibs/
          merge-multiple: true
      - name: Install APK verification tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"'
      - name: Restore and validate release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required signing secret $name is missing; refusing an unsigned or debug-signed release."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/xmplus-release.jks"
          keytool -exportcert -keystore "$RUNNER_TEMP/xmplus-release.jks" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" \
            -file "$RUNNER_TEMP/xmplus-release.der"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/xmplus-release.jks" >> "$GITHUB_ENV"
      - name: Build signed split APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: >-
          flutter build apk --release --split-per-abi --no-pub
          --dart-define=SENTRY_DSN="$SENTRY_DSN"
          --dart-define=SENTRY_ENVIRONMENT="$SENTRY_ENVIRONMENT"
      - name: Upload Android debug symbols
        env:
          SENTRY_RELEASE: ${{ steps.version.outputs.release }}
          SENTRY_DIST: ${{ steps.version.outputs.dist }}
        run: >-
          dart --disable-dart-dev --packages=.dart_tool/package_config.json tool/upload_sentry_symbols.dart
          --sentry-define=org="$SENTRY_ORG"
          --sentry-define=project="$SENTRY_PROJECT"
          --sentry-define=symbols_path=build
          --sentry-define=release="$SENTRY_RELEASE"
          --sentry-define=dist="$SENTRY_DIST"
          --sentry-define=commits=false
      - name: Verify APK signatures, package and version
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/36.0.0"
          expected=$(sha256sum "$RUNNER_TEMP/xmplus-release.der" | cut -d' ' -f1)
          mkdir -p release
          for abi in armeabi-v7a arm64-v8a x86_64; do
            apk="build/app/outputs/flutter-apk/app-$abi-release.apk"
            test -s "$apk"
            "$tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apk-cert.txt"
            actual=$(awk '/^Signer #1 certificate SHA-256 digest:/ {print tolower($NF)}' "$RUNNER_TEMP/apk-cert.txt")
            [[ "$actual" == "$expected" ]] || { echo '::error::APK signing certificate differs from release keystore'; exit 1; }
            package=$("$tools/aapt" dump badging "$apk" | grep '^package:')
            [[ "$package" == *"name='teikengstudio.xmplus'"* ]] || { echo '::error::Unexpected applicationId'; exit 1; }
            [[ "$package" == *"versionName='$APP_VERSION'"* ]] || { echo '::error::Unexpected APK version'; exit 1; }
            cp "$apk" "release/XMPlus-$APP_VERSION-android-$abi.apk"
          done
          (cd release && sha256sum ./*.apk > SHA256SUMS)
      - name: Upload verified release APKs
        uses: actions/upload-artifact@v6
        with:
          name: XMPlus-${{ steps.version.outputs.version }}-android
          path: release/*
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/xmplus-release.jks" "$RUNNER_TEMP/xmplus-release.der" "$RUNNER_TEMP/apk-cert.txt"

  windows:
    needs: native-tools
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-2022
    env:
      SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_UPLOAD_SYMBOLS: 'true'
      SENTRY_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Require release telemetry configuration
        shell: pwsh
        run: |
          foreach ($name in @('SENTRY_DSN', 'SENTRY_ORG', 'SENTRY_PROJECT', 'SENTRY_AUTH_TOKEN')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name, 'Process'))) {
              throw "Required Sentry configuration $name is missing; configure variables SENTRY_DSN/SENTRY_ORG/SENTRY_PROJECT and secret SENTRY_AUTH_TOKEN."
            }
          }
      - name: Restore source-built Windows runtime and provenance
        uses: actions/download-artifact@v7
        with:
          name: windows-native-runtime
          path: ${{ runner.temp }}/windows-native
      - name: Unpack native supply
        shell: pwsh
        run: Expand-Archive -LiteralPath "$env:RUNNER_TEMP/windows-native/windows-native-supply.zip" -DestinationPath build/windows-native
      - name: Build and package Windows
        shell: pwsh
        run: ./tool/build_windows.ps1 -RuntimeOnly
      - name: Upload Windows release files
        uses: actions/upload-artifact@v6
        with:
          name: XMPlus-windows
          path: dist/XMPlus-*-windows-x64*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [signed, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: XMPlus-${{ needs.signed.outputs.version }}-android
          path: release
      - uses: actions/download-artifact@v7
        with:
          name: XMPlus-windows
          path: release
      - name: Publish Android and Windows release files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          (cd release && sha256sum --check SHA256SUMS)
          (cd release && sha256sum ./*.apk ./*.zip > SHA256SUMS)
          python3 tool/release_notes.py "$RELEASE_TAG" --output release/RELEASE-NOTES.md
          release_flags=()
          if [[ "$RELEASE_TAG" == "v1.1.8" ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/*.apk release/*.zip release/SHA256SUMS --clobber
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file release/RELEASE-NOTES.md "${release_flags[@]}"
          else
            gh release create "$RELEASE_TAG" release/*.apk release/*.zip release/SHA256SUMS \
              --verify-tag --title "$RELEASE_TAG" --notes-file release/RELEASE-NOTES.md "${release_flags[@]}"
          fi
