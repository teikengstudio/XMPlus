name: xmly_flutter
description: XMPlus 下载与收听客户端
publish_to: none
version: 1.1.10+12
environment:
  sdk: '>=3.13.7 <4.0.0'
  flutter: '>=3.47.9'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: 1.0.0
  get: 4.7.3
  dio: ^5.9.1
  crypto: ^3.0.6
  encrypt: ^5.0.3
  archive: ^4.0.0
  file_picker: ^13.1.0
  path: ^1.9.1
  path_provider: ^2.1.5
  synchronized: ^3.3.0
  uuid: ^4.5.1
  media_kit: 1.2.6
  media_kit_libs_audio: 1.0.7
  audio_service: ^0.18.19
  audio_service_platform_interface: ^0.1.3
  audio_session: ^0.2.4
  flutter_inappwebview: 6.1.5
  flutter_secure_storage: 11.2.0
  window_manager: 0.5.1
  tray_manager: 0.8.0
  win32: ^6.3.0
  ffi: ^2.2.0
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  pub_semver: ^2.2.1
  device_info_plus: ^13.3.0
  sentry_flutter: 10.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  sentry_dart_plugin: 3.4.0
  analyzer: 14.7.0
sentry:
  org: tkstudio
  project: xmplus
  upload_debug_symbols: true
  upload_sources: false
  upload_source_maps: false
  wait_for_processing: true
flutter:
  uses-material-design: true
  assets:
    - assets/branding/xmplus.png
    - windows/runner/resources/app_icon.ico
    - LICENSE
    - NOTICE
    - windows/LICENSE.PiliPlus
    - licenses/android/THIRD-PARTY-NOTICES.txt
    - licenses/media/THIRD-PARTY-NOTICES.txt
    - licenses/fonts/HarmonyOS_Sans_SC_LICENSE.txt
  fonts:
    - family: HarmonyOS Sans SC
      fonts:
        - asset: assets/fonts/HarmonyOS_Sans_SC_Regular.ttf
          weight: 400
        - asset: assets/fonts/HarmonyOS_Sans_SC_Medium.ttf
          weight: 500
        - asset: assets/fonts/HarmonyOS_Sans_SC_Bold.ttf
          weight: 700
